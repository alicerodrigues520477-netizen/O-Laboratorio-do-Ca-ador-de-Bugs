<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice's Library mudou de endereço</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="6;url=https://alicerodrigues520477-netizen.github.io/CantAlice/alices-library/">
<style>
  html, body { margin: 0; height: 100%; background: #2a1a14; color: #f4ead3; font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 18vh 24px 24px; text-align: center; }
  h1 { font: 400 34px/1.15 Didot, "Bodoni 72", Georgia, serif; margin: 0 0 14px; }
  a { color: #ecd99d; }
  .s { opacity: .7; font-size: 15px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Alice's Library mudou de endereço</h1>
  <p>O app agora fica em<br><a id="go" href="https://alicerodrigues520477-netizen.github.io/CantAlice/alices-library/">CantAlice › alices-library</a>.</p>
  <p>Você será levado para lá em instantes.</p>
  <p class="s">No iPad: apague este ícone da Tela de Início e, na página nova, use Compartilhar → Adicionar à Tela de Início.</p>
</main>
<script>
  // Limpa o app antigo deste endereço (service worker e cache) sem mexer nos outros apps do site, e vai para o endereço novo.
  (async () => {
    const NEW = document.getElementById('go').href;
    try {
      if ('serviceWorker' in navigator) {
        for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.includes('/leitor-ipad/')) await r.unregister();
      }
      if (window.caches) {
        for (const name of await caches.keys()) {
          const c = await caches.open(name);
          for (const req of await c.keys()) if (req.url.includes('/leitor-ipad/')) await c.delete(req);
        }
      }
    } catch (e) { /* o redirecionamento por meta refresh continua valendo */ }
    setTimeout(() => location.replace(NEW), 1500);
  })();
</script>
</body>
</html>
